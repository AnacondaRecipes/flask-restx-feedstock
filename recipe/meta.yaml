{% set name = "flask-restx" %}
{% set version = "1.3.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/python-restx/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
  sha256: c42e5ba15ce5ace1270e9f9129f94abdbf736c16ef77ec65c3b2841aa3c6ee95

build:
  skip: true  # [py<39]
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  host:
    - python
    - pip
    - wheel
    - setuptools
  run:
    - python
    - aniso8601 >=0.82
    - jsonschema
    - flask >=0.8,!=2.0.0
    - werkzeug !=2.0.0
    - importlib_resources
    - referencing

# Following tests cannot run due to missing fixture provided by pytest-flask
# E       fixture 'client' not found
{% set ignore_tests = " --ignore=tests/legacy/test_api_legacy.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_api.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_errors.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_postman.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_reqparse.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_accept.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_apidoc.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_cors.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_fields_mask.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_logging.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_marshalling.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_namespace.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_payload.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_swagger.py" %}

# E           RuntimeError: Working outside of application context.

test:
  source_files:
    - tests
    - setup.cfg
  imports:
    - flask_restx
    - flask_restx.errors
    - flask_restx.reqparse
    - flask_restx.swagger
  requires:
    - pip
    - pytest >=7.0.1
    - faker >=2.0.0
    - pytest-benchmark >=3.4.1
    - pytest-mock
    - pytest-cov
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -v tests {{ ignore_tests }}

about:
  home: https://github.com/python-restx/flask-restx
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Fully featured framework for fast, easy and documented API development with Flask
  description: |
    Flask-RESTX is an extension for Flask that adds support for quickly building REST APIs.
    Flask-RESTX encourages best practices with minimal setup. If you are familiar with Flask,
    Flask-RESTX should be easy to pick up. It provides a coherent collection of decorators and
    tools to describe your API and expose its documentation properly using Swagger.
  doc_url: https://flask-restx.readthedocs.io
  dev_url: https://github.com/python-restx/flask-restx

extra:
  recipe-maintainers:
    - SVilgelm
    - fhoehle
